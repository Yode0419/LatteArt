<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#080403" />
    <meta name="description" content="Create and share latte art with a tactile fluid simulation." />
    <title>LatteArt — Latte Art Simulator</title>
    <link rel="stylesheet" href="assets/styles.css" />
  </head>
  <body>
    <!--
      THESIS: The screen is a lacquer serving tray where making the latte is the interface; it refuses the generic simulator dashboard.
      OWN-WORLD: Near-black oxblood lacquer, matte porcelain, warm copper hairlines, and flat smoked-frosted controls.
      STORY: Choose a tool, shape the cup directly, tune details only when needed, then raise the bottom tray to serve, save, or share.
      FIRST VIEWPORT: Compact wordmark and utility actions above an oversized live cup; a three-part tool control sits below; Finish is the bottom tray.
      FORM: Lacquer Service Tray, grounded direction 7, seed 3eb7136a.
      FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
    -->
    <div class="app-shell" id="appShell">
      <header class="topbar">
        <a class="wordmark" href="./" aria-label="LatteArt home">LatteArt</a>
        <div class="topbar-actions">
          <button class="icon-button" id="restartButton" type="button" data-i18n-aria="reset" aria-label="Reset latte">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M4.6 8.2A8 8 0 1 1 4 14" /><path d="M4.6 3.8v4.4H9" /></svg>
          </button>
          <button class="icon-button" id="settingsButton" type="button" data-i18n-aria="settings" aria-label="Open settings" aria-controls="settingsDrawer" aria-expanded="false">
            <svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 8.8a3.2 3.2 0 1 0 0 6.4 3.2 3.2 0 0 0 0-6.4Z" /><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.9l.1.1-2.8 2.8-.1-.1a1.7 1.7 0 0 0-1.9-.3 1.7 1.7 0 0 0-1 1.6v.2h-4V21a1.7 1.7 0 0 0-1-1.6 1.7 1.7 0 0 0-1.9.3l-.1.1L4.2 17l.1-.1a1.7 1.7 0 0 0 .3-1.9A1.7 1.7 0 0 0 3 14H2.8v-4H3a1.7 1.7 0 0 0 1.6-1 1.7 1.7 0 0 0-.3-1.9L4.2 7 7 4.2l.1.1a1.7 1.7 0 0 0 1.9.3A1.7 1.7 0 0 0 10 3v-.2h4V3a1.7 1.7 0 0 0 1 1.6 1.7 1.7 0 0 0 1.9-.3l.1-.1L19.8 7l-.1.1a1.7 1.7 0 0 0-.3 1.9 1.7 1.7 0 0 0 1.6 1h.2v4H21a1.7 1.7 0 0 0-1.6 1Z" /></svg>
          </button>
        </div>
      </header>

      <main class="workspace">
        <div class="canvas-stage" id="artworkCapture">
          <div class="cup-shadow" aria-hidden="true"></div>
          <canvas id="myCanvas" tabindex="0" role="img" data-i18n-aria="canvas" aria-label="Interactive latte art canvas"></canvas>
          <img class="porcelain-rim" src="assets/porcelain-rim.png" alt="" aria-hidden="true" />
          <div class="touch-trace" aria-hidden="true"><span></span></div>
          <span class="keyboard-cursor" aria-hidden="true"></span>
        </div>

        <div class="tool-selector" role="toolbar" data-i18n-aria="tools" aria-label="Creative tools">
          <button class="tool-button active" id="pouringMode" type="button" aria-pressed="true">
            <svg aria-hidden="true" viewBox="0 0 32 32"><path d="M7.5 11.5h10l2 13h-14l2-13Z" /><path d="M18 13.5c4 .4 6.5 2.3 7.5 5.5" /><path d="M8.5 11.5c0-3.2 1.7-5 4.5-5s4.5 1.8 4.5 5" /><path d="M22 20c2 1.2 3 2.7 3 4.5" /></svg>
            <span data-i18n="pour">Pour</span>
          </button>
          <button class="tool-button" id="stirringMode" type="button" aria-pressed="false">
            <svg aria-hidden="true" viewBox="0 0 32 32"><path d="m17.8 5.5-3.2 19" /><path d="M8 20.5c1.7-2.2 4.4-3.5 8-3.5 5 0 8 2.2 8 5s-3 5-8 5-8-2.2-8-5" /><path d="m17.8 5.5 1.5-1.8" /></svg>
            <span data-i18n="stir">Stir</span>
          </button>
          <button class="tool-button" id="suctionMode" type="button" aria-pressed="false">
            <svg aria-hidden="true" viewBox="0 0 32 32"><circle cx="16" cy="16" r="2.5" /><path d="M6 6 12 12M12 12H8M12 12V8" /><path d="m26 6-6 6M20 12h4M20 12V8" /><path d="m6 26 6-6M12 20H8M12 20v4" /><path d="m26 26-6-6M20 20h4M20 20v4" /></svg>
            <span data-i18n="suction">Suction</span>
          </button>
        </div>
      </main>

      <button class="finish-tray" id="finishTray" type="button" aria-controls="completionSheet">
        <span class="sheet-handle" aria-hidden="true"></span>
        <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 14 5-5 5 5" /></svg>
        <span data-i18n="finish">Finish</span>
      </button>
    </div>

    <div class="sheet-scrim" id="sheetScrim" aria-hidden="true"></div>

    <aside class="bottom-sheet settings-sheet" id="settingsDrawer" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="settingsTitle">
      <span class="sheet-handle" aria-hidden="true"></span>
      <header class="sheet-header">
        <h2 id="settingsTitle" data-i18n="settings">Settings</h2>
        <button class="sheet-close" id="closeSettings" type="button" data-i18n-aria="closeSettings" aria-label="Close settings">
          <svg aria-hidden="true" viewBox="0 0 24 24"><path d="m6 6 12 12M18 6 6 18" /></svg>
        </button>
      </header>
      <div class="settings-scroll">
        <section class="settings-section language-setting" aria-labelledby="languageLabel">
          <h3 id="languageLabel" data-i18n="language">Language</h3>
          <div class="language-toggle" role="group" aria-labelledby="languageLabel">
            <button type="button" data-language="zh-TW">繁中</button>
            <button type="button" data-language="en">English</button>
          </div>
        </section>

        <section class="settings-section tool-settings" id="pouringControls">
          <h3 class="active-tool-title" data-tool-title="pour">Active tool · Pour</h3>
          <div class="range-row"><label for="pourRadius" data-i18n="radius">Radius</label><input type="range" id="pourRadius" min="0.01" max="0.1" step="0.01" /><output class="value-display" id="pourRadius-value" for="pourRadius"></output></div>
          <div class="range-row"><label for="pourStrength" data-i18n="strength">Strength</label><input type="range" id="pourStrength" min="0.01" max="0.1" step="0.01" /><output class="value-display" id="pourStrength-value" for="pourStrength"></output></div>
        </section>

        <section class="settings-section tool-settings" id="stirringControls" hidden>
          <h3 class="active-tool-title" data-tool-title="stir">Active tool · Stir</h3>
          <div class="range-row"><label for="stirRadius" data-i18n="radius">Radius</label><input type="range" id="stirRadius" min="0.01" max="0.05" step="0.005" /><output class="value-display" id="stirRadius-value" for="stirRadius"></output></div>
          <div class="range-row"><label for="stirStrength" data-i18n="strength">Strength</label><input type="range" id="stirStrength" min="0.5" max="5" step="0.5" /><output class="value-display" id="stirStrength-value" for="stirStrength"></output></div>
        </section>

        <section class="settings-section tool-settings" id="suctionControls" hidden>
          <h3 class="active-tool-title" data-tool-title="suction">Active tool · Suction</h3>
          <div class="range-row"><label for="suctionRadius" data-i18n="radius">Radius</label><input type="range" id="suctionRadius" min="0.01" max="0.2" step="0.01" /><output class="value-display" id="suctionRadius-value" for="suctionRadius"></output></div>
          <div class="range-row"><label for="suctionStrength" data-i18n="strength">Strength</label><input type="range" id="suctionStrength" min="0.01" max="0.2" step="0.01" /><output class="value-display" id="suctionStrength-value" for="suctionStrength"></output></div>
        </section>

        <section class="settings-section" aria-labelledby="displayTitle">
          <h3 id="displayTitle" data-i18n="display">Display</h3>
          <div class="range-row"><label for="resolution" data-i18n="resolution">Resolution</label><input type="range" id="resolution" min="120" max="240" step="20" /><output class="value-display" id="resolution-value" for="resolution"></output></div>
          <label class="toggle-row" for="showStreamlines"><span data-i18n="streamlines">Streamlines</span><input type="checkbox" id="showStreamlines" /><span class="toggle-track" aria-hidden="true"><span></span></span></label>
        </section>

        <details class="settings-section advanced-settings">
          <summary><span data-i18n="advanced">Advanced simulation</span><svg aria-hidden="true" viewBox="0 0 24 24"><path d="m7 9 5 5 5-5" /></svg></summary>
          <div class="advanced-fields">
            <div class="range-row"><label for="viscosity" data-i18n="viscosity">Viscosity</label><input type="range" id="viscosity" min="0.9" max="1" step="0.005" /><output class="value-display" id="viscosity-value" for="viscosity"></output></div>
            <div class="range-row"><label for="gravity" data-i18n="gravity">Gravity</label><input type="range" id="gravity" min="-5" max="5" step="0.5" /><output class="value-display" id="gravity-value" for="gravity"></output></div>
            <div class="range-row"><label for="numIters" data-i18n="iterations">Iterations</label><input type="range" id="numIters" min="1" max="50" step="1" /><output class="value-display" id="numIters-value" for="numIters"></output></div>
            <div class="range-row"><label for="overRelaxation" data-i18n="relaxation">Over-relaxation</label><input type="range" id="overRelaxation" min="1" max="2" step="0.1" /><output class="value-display" id="overRelaxation-value" for="overRelaxation"></output></div>
          </div>
        </details>
      </div>
    </aside>

    <aside class="bottom-sheet completion-sheet" id="completionSheet" role="dialog" aria-modal="true" aria-hidden="true" aria-labelledby="completionTitle">
      <span class="sheet-handle" aria-hidden="true"></span>
      <h2 id="completionTitle" data-i18n="ready">Your latte is ready</h2>
      <div class="completion-actions">
        <button class="completion-action primary" id="saveButton" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M5 20h14" /></svg><span data-i18n="save">Save Image</span></button>
        <button class="completion-action" id="shareButton" type="button"><svg aria-hidden="true" viewBox="0 0 24 24"><circle cx="18" cy="5" r="2.5" /><circle cx="6" cy="12" r="2.5" /><circle cx="18" cy="19" r="2.5" /><path d="m8.2 10.8 7.6-4.5M8.2 13.2l7.6 4.5" /></svg><span data-i18n="share">Share</span></button>
      </div>
      <button class="keep-editing" id="keepEditing" type="button" data-i18n="keepEditing">Keep editing</button>
    </aside>

    <div class="loading-overlay" id="shareLoading" role="status" aria-live="polite" aria-hidden="true"><span class="loading-spinner" aria-hidden="true"></span><span data-i18n="preparing">Preparing your latte…</span></div>
    <div class="toast" id="toast" role="status" aria-live="polite"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script type="module" src="src/main.js"></script>
  </body>
</html>
